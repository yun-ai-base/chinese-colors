<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>中国传统色彩 · 67 色古画着色体验</title>
<meta name="description" content="67 种中国传统色彩：点击色卡为古画着色，翻阅诗文与实物考据，探索配色灵感。">
<meta property="og:title" content="中国传统色彩">
<meta property="og:description" content="点击色卡，为唐宋古画着色。67 种传统色，一部可触摸的色彩史。">
<meta property="og:type" content="website">
<meta property="og:image" content="zanhua.jpg">

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/index.css">
<style>
/* ========== 基础 token ========== */
:root{
  --c-paper:#f5f0e8; --c-paper-2:#efe7d8; --c-surface:#fffdf8; --c-surface-2:#f8f4ee;
  --c-ink:#3d2b1f; --c-ink-2:#57493c; --c-ink-3:#6f5f4e;
  --c-line:#d4c8b8; --c-line-soft:rgba(61,43,31,.12); --c-accent:#c0392b; --c-accent-soft:rgba(192,57,43,.08);
  --shadow-1:0 2px 8px rgba(61,43,31,.08); --shadow-2:0 10px 28px rgba(61,43,31,.14);
  --radius-lg:16px; --radius-md:10px; --radius-sm:8px; --radius-pill:999px;
  --carousel-radius:240px;
  --serif:"Noto Serif SC","Source Han Serif SC","SimSun","STSong",serif;
  --sans:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  /* 语义 token */
  --bg:var(--c-paper); --surface:var(--c-surface); --surface-2:var(--c-surface-2);
  --text:var(--c-ink); --text-2:var(--c-ink-2); --muted:var(--c-ink-3);
  --border:var(--c-line); --accent:var(--c-accent);
  --paper-noise:0.05;
}
html[data-theme="dark"]{
  --c-paper:#211c17; --c-paper-2:#2a241d; --c-surface:#322b22; --c-surface-2:#3a3228;
  --c-ink:#ece3d2; --c-ink-2:#c9bca7; --c-ink-3:#a2907a;
  --c-line:#4a4034; --c-line-soft:rgba(236,227,210,.14); --c-accent:#e0674f; --c-accent-soft:rgba(224,103,79,.14);
  --shadow-1:0 2px 8px rgba(0,0,0,.3); --shadow-2:0 10px 28px rgba(0,0,0,.4);
  --paper-noise:0.07;
  --carousel-radius:220px;
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--serif);min-height:100vh;
  -webkit-font-smoothing:antialiased;position:relative;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--paper-noise);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='1'/></feComponentTransfer></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh}
header{text-align:center;padding:12px 20px 8px;border-bottom:1px solid var(--border);flex-shrink:0;position:relative}
header h1{font-size:22px;font-weight:700;letter-spacing:6px}
header .sub{font-size:12px;color:var(--muted);margin-top:2px;letter-spacing:2px}
.icon-btn{
  position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;
  transition:all .2s;color:var(--text-2);
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn svg{width:17px;height:17px}
.today-badge{
  position:absolute;top:12px;left:14px;display:inline-flex;align-items:center;gap:6px;
  font-size:11px;letter-spacing:1px;color:var(--muted);padding:5px 12px;border-radius:var(--radius-pill);
  border:1px dashed var(--border);background:var(--surface);transition:all .2s;font-family:var(--sans);
}
.today-badge:hover{border-color:var(--accent);color:var(--accent)}
.today-badge .sw{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px var(--border)}
.main-content{display:flex;flex:1;overflow:hidden}
/* ========== 左侧：轮播 + 信息卡 ========== */
.left-panel{width:42%;display:flex;flex-direction:column;align-items:center;padding:15px 15px 8px;border-right:1px solid var(--border);overflow:hidden}
.carousel-wrap{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;perspective:800px;position:relative}
.carousel-wrap::before{content:'';position:absolute;width:90%;padding-bottom:90%;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(200,180,160,.22) 0%,rgba(200,180,160,.06) 45%,transparent 70%);pointer-events:none;border-radius:50%}
.carousel{width:280px;height:290px;position:relative;transform-style:preserve-3d;cursor:grab;will-change:transform}
.carousel:active{cursor:grabbing}
.carousel-card{position:absolute;width:260px;height:270px;left:10px;top:10px;backface-visibility:hidden;border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow-1);display:flex;align-items:center;justify-content:center;flex-direction:column;will-change:transform,opacity}
.carousel-card .img-wrap{width:100%;height:100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--c-paper-2)}
.carousel-card .img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.carousel-card .img-wrap::after{content:'';position:absolute;bottom:0;left:0;right:0;height:56px;background:linear-gradient(transparent,var(--surface));pointer-events:none}
.carousel-card .color-overlay{position:absolute;inset:0;mix-blend-mode:color;background:var(--robe-color);opacity:0.5;pointer-events:none;transition:background 0.5s;-webkit-mask-image:var(--overlay-mask);mask-image:var(--overlay-mask);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.carousel-card .painting-name{position:absolute;top:0;left:0;right:0;padding:7px 10px;background:linear-gradient(rgba(0,0,0,.55),transparent);color:#f0e8d8;font-size:12px;letter-spacing:2px;text-align:center;pointer-events:none}
.carousel-card .lady-name{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);letter-spacing:2px;pointer-events:none}
.carousel-card .pattern-desc{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);letter-spacing:1px;pointer-events:none;font-family:var(--sans);padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carousel-card svg{width:90%;height:90%;display:block}
.carousel-card .robe{transition:fill 0.5s ease}
/* 画作主色点 */
.paint-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:3}
.paint-dot{
  width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.9);
  box-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .15s;padding:0;position:relative;
}
.paint-dot:hover{transform:scale(1.25)}
.paint-dot.active{box-shadow:0 0 0 2px var(--accent),0 1px 4px rgba(0,0,0,.4)}
.paint-dot .dot-tip{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:10px;font-family:var(--sans);color:#fff;background:rgba(30,25,18,.85);
  padding:2px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s;letter-spacing:1px;
}
.paint-dot:hover .dot-tip{opacity:1}
/* 信息卡 */
.info-panel{width:100%;text-align:center}
.flip-wrap{
  perspective:800px;width:100%;max-width:420px;flex-shrink:0;padding:12px 0 4px;position:relative;
  -webkit-user-select:none;user-select:none;
}
.flip-wrap::before{content:'';display:block;width:70%;height:5px;border-radius:3px;margin:0 auto 10px;background:var(--robe-color);transition:background .5s}
.flip-wrap::after{
  content:'';position:absolute;top:9px;left:15%;width:9px;height:9px;border-radius:50%;
  background:var(--dot-color-0,var(--robe-color));animation:bounceDot 5s cubic-bezier(.45,.05,.55,.95) infinite;
  box-shadow:0 0 10px var(--dot-color-0,var(--robe-color));
}
.flip-inner{position:relative;width:100%;min-height:200px;transition:transform .6s ease;transform-style:preserve-3d}
.flip-wrap.flipped .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{position:relative;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center}
.flip-back{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px 12px;overflow-y:auto}
.back-poem{font-size:15px;color:var(--text-2);line-height:1.8;font-style:italic;letter-spacing:1px;max-width:380px;margin-bottom:10px;position:relative;padding:0 10px}
.back-poem::before{content:'\AB';color:var(--accent);font-size:18px;opacity:.5;margin-right:4px}
.back-poem::after{content:'\BB';color:var(--accent);font-size:18px;opacity:.5;margin-left:4px}
.back-poem.none{font-style:normal;color:var(--muted);font-size:13px}
.back-object{font-size:13px;color:var(--text-2);line-height:1.6;letter-spacing:1px;max-width:380px;padding:8px 14px;background:var(--c-accent-soft);border-radius:var(--radius-sm);border:1px solid rgba(192,57,43,.12)}
.back-object-label{font-size:11px;color:var(--muted);letter-spacing:2px;margin:4px 0 2px}
.flip-hint{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:6px;opacity:.5;transition:opacity .3s}
.flip-wrap:hover .flip-hint{opacity:.8}
@keyframes bounceDot{
0%{left:15%;background:var(--dot-color-0,var(--robe-color));box-shadow:0 0 10px var(--dot-color-0,var(--robe-color));transform:scaleX(.7) scaleY(1.35)}
12%{transform:scaleX(1.05) scaleY(.95)}
25%{left:32.5%;background:var(--dot-color-1,var(--robe-color));box-shadow:0 0 12px var(--dot-color-1,var(--robe-color));transform:scaleX(1.1) scaleY(.9)}
37%{transform:scaleX(1.05) scaleY(.95)}
50%{left:calc(85% - 9px);background:var(--dot-color-2,var(--robe-color));box-shadow:0 0 10px var(--dot-color-2,var(--robe-color));transform:scaleX(.7) scaleY(1.35)}
62%{transform:scaleX(1.05) scaleY(.95)}
75%{left:32.5%;background:var(--dot-color-3,var(--robe-color));box-shadow:0 0 12px var(--dot-color-3,var(--robe-color));transform:scaleX(1.1) scaleY(.9)}
87%{transform:scaleX(1.05) scaleY(.95)}
100%{left:15%;background:var(--dot-color-4,var(--robe-color));box-shadow:0 0 10px var(--dot-color-4,var(--robe-color));transform:scaleX(.7) scaleY(1.35)}
}
.color-name-row{display:flex;justify-content:center;align-items:baseline;gap:10px;margin-bottom:2px;flex-wrap:wrap}
.color-name-row .name{font-size:26px;font-weight:700;letter-spacing:4px}
.color-name-row .name ruby{text-decoration:none}
.color-name-row .name rt{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0}
.color-name-row .hex{font-size:13px;color:var(--muted);font-family:var(--mono)}
.color-desc{font-size:13px;color:var(--text-2);line-height:1.6;max-width:360px;margin:2px auto 6px}
.info-actions{display:flex;justify-content:center;gap:8px;margin:6px 0}
.mini-btn{
  display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:var(--radius-pill);
  border:1px solid var(--border);background:var(--surface);font-size:12px;font-family:var(--sans);
  transition:all .2s;color:var(--text-2);
}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn svg{width:13px;height:13px}
.mini-btn.faved{color:var(--accent);border-color:var(--accent);background:var(--c-accent-soft)}
.related-label{font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:2px}
.related-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.related-chip{
  display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--radius-pill);font-size:12px;cursor:pointer;
  border:1px solid var(--border);transition:all 0.2s;background:var(--surface);font-family:var(--sans);
}
.related-chip:hover{border-color:var(--accent)}
.related-chip .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.related-chip .f-tag{font-size:9px;color:var(--muted);margin-left:4px;letter-spacing:0}
.palette-section{margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.palette-label{font-size:11px;color:var(--muted);margin-bottom:6px;letter-spacing:2px}
.palette-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.palette-item-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.palette-item{
  width:34px;height:34px;border-radius:50%;cursor:pointer;transition:transform .25s,box-shadow .25s;
  box-shadow:0 2px 6px var(--shadow-1),0 0 0 2px var(--surface);flex-shrink:0;padding:0;border:1px solid var(--c-line-soft);
}
.palette-item:hover{transform:translateY(-4px) scale(1.12);box-shadow:var(--shadow-2),0 0 0 2px var(--surface);z-index:2}
.palette-item-name{font-size:10px;color:var(--muted);white-space:nowrap;max-width:42px;overflow:hidden;text-overflow:ellipsis;text-align:center}
/* ========== 右侧：工具栏 + 网格 ========== */
.right-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.toolbar{padding:10px 14px 6px;flex-shrink:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid var(--border)}
.filter-group{display:flex;flex-wrap:wrap;gap:4px}
.btn{
  padding:4px 12px;border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--surface);
  font-size:13px;cursor:pointer;transition:all 0.2s;color:var(--text);font-family:var(--sans);letter-spacing:1px;
  display:inline-flex;align-items:center;gap:4px;flex-shrink:0;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn svg{width:13px;height:13px}
.mode-btn{font-size:12px}
.search-input{
  flex:1;min-width:100px;padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius-pill);
  font-size:13px;background:var(--surface);color:var(--text);outline:none;font-family:var(--sans);
}
.search-input:focus-visible{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}
/* 统计面板 */
.viz-panel{
  display:flex;gap:24px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;
  background:var(--surface-2);align-items:center;
}
.viz-panel[hidden]{display:none}
.viz-title{font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:8px;text-align:center}
.donut{width:110px;height:110px;border-radius:50%;margin:0 auto;position:relative}
.donut::after{content:'';position:absolute;inset:22px;border-radius:50%;background:var(--surface-2)}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--muted);letter-spacing:1px;z-index:1}
.donut-center b{font-size:16px;color:var(--text);font-weight:700}
.donut-legend{display:grid;grid-template-columns:repeat(2,minmax(64px,1fr));gap:4px 12px;margin-top:8px;font-family:var(--sans)}
.donut-legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-2)}
.donut-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
#hueCanvas{cursor:crosshair;background:radial-gradient(circle at center,#fff 0%,#f0ece2 55%,transparent 56%);border-radius:50%;border:1px solid var(--c-line-soft)}
html[data-theme="dark"] #hueCanvas{background:radial-gradient(circle at center,#2a241d 0%,#3a3228 55%,transparent 56%)}
/* 网格 */
.grid-wrap{flex:1;overflow-y:auto;padding:10px;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:14px}
.color-card{
  border-radius:var(--radius-lg);background:var(--surface);cursor:pointer;text-align:center;
  transition:transform 0.25s,box-shadow 0.25s;box-shadow:var(--shadow-1);border:2px solid transparent;
  padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;
}
.color-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-2)}
.color-card:active{transform:scale(.97)}
.color-card.active{border-color:var(--accent)}
.color-card.active::after{content:'✓';position:absolute;top:8px;right:10px;font-size:12px;color:var(--accent)}
.color-card{position:relative}
.color-swatch{
  width:82px;height:82px;border-radius:50%;transition:transform .3s,box-shadow .3s;position:relative;
  box-shadow:0 6px 16px rgba(0,0,0,.15),0 2px 4px rgba(0,0,0,.1),inset 0 -3px 6px rgba(0,0,0,.08);flex-shrink:0;
}
.color-swatch::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.5) 0%,rgba(255,255,255,.12) 20%,transparent 45%,rgba(0,0,0,.12) 70%,rgba(0,0,0,.35) 100%);pointer-events:none}
.color-swatch::after{content:'';position:absolute;top:7%;left:20%;width:28%;height:18%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.6) 0%,transparent 70%);pointer-events:none}
.color-card:hover .color-swatch{transform:scale(1.06)}
.color-card .info{padding:6px 4px 0}
.color-card .info .cname{font-size:14px;font-weight:700;letter-spacing:1px}
.color-card .info .cname ruby{text-decoration:none}
.color-card .info .cname rt{font-size:9px;font-weight:400;color:var(--muted);letter-spacing:0}
.color-card .info .cfamily{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:2px;opacity:.7}
.empty-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;letter-spacing:2px}
.hint-bar{text-align:center;padding:5px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);flex-shrink:0;font-family:var(--sans)}
.hint-twin-btn{color:var(--muted);cursor:pointer;transition:color .25s;display:inline;letter-spacing:0}
.hint-twin-btn:hover{color:var(--accent)}
.hint-sub{font-size:.8em;opacity:.6}
.hint-bar-sep{color:var(--border);margin:0 4px}
/* ========== 孪生宇宙弹窗 ========== */
.twin-overlay{display:none;position:fixed;inset:0;z-index:1100;background:rgba(30,25,18,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px}
.twin-overlay.open{display:flex}
.twin-panel{position:relative;width:100%;max-width:800px;max-height:85vh;background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-2);overflow:hidden;display:flex;flex-direction:column;animation:modalSlideUp .35s ease}
@keyframes modalSlideUp{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.twin-close{
  position:absolute;top:12px;right:12px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);background:var(--surface-2);border-radius:50%;transition:all .25s ease;z-index:10;
}
.twin-close:hover{color:var(--accent);background:var(--c-accent-soft);transform:rotate(90deg)}
.twin-close svg{width:16px;height:16px}
.twin-header{text-align:center;padding:36px 32px 20px;flex-shrink:0}
.twin-header h2{font-size:1.3rem;font-weight:700;color:var(--text);letter-spacing:4px}
.twin-subtitle{font-size:.78rem;color:var(--muted);letter-spacing:2px;margin-top:6px}
.twin-body{padding:0 32px 28px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.twin-section{margin-bottom:28px}
.twin-section:last-child{margin-bottom:0}
.twin-section-title{font-size:.8rem;font-weight:600;color:var(--text);letter-spacing:2px;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--c-line-soft);display:flex;align-items:center;gap:6px}
.twin-grid{display:flex;flex-wrap:wrap;gap:10px}
.twin-card{display:inline-flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);text-decoration:none;transition:all .25s ease;flex:1;min-width:200px;max-width:360px;color:var(--text)}
.twin-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-2)}
.twin-card-icon{font-size:1.2rem;flex-shrink:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--surface);border-radius:var(--radius-sm)}
.twin-card-info{flex:1;min-width:0;display:flex;flex-direction:column}
.twin-card-name{font-size:.85rem;font-weight:600;color:var(--text);line-height:1.4}
.twin-card-desc{font-size:.72rem;color:var(--muted);line-height:1.4;margin-top:2px}
.twin-card-arrow{font-size:.9rem;color:var(--muted);flex-shrink:0;transition:all .25s}
.twin-card:hover .twin-card-arrow{color:var(--accent);transform:translateX(3px)}
.twin-msg{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;letter-spacing:2px}
/* ========== Toast ========== */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:1300;
  background:var(--c-ink);color:var(--bg);padding:9px 18px;border-radius:var(--radius-pill);
  font-size:13px;font-family:var(--sans);letter-spacing:1px;opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;box-shadow:var(--shadow-2);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ========== 移动端降级：横滑轮播 ========== */
.carousel-swipe{
  display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  width:100%;max-width:560px;padding:8px 12px 14px;height:auto;transform:none;perspective:none;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;cursor:grab;
}
.carousel-swipe::-webkit-scrollbar{display:none}
.carousel-swipe .carousel-card{
  position:relative;left:auto;top:auto;flex:0 0 82%;scroll-snap-align:center;
  width:82%;max-width:330px;height:auto;aspect-ratio:4/4.2;transform:none;opacity:1;
}
.carousel-swipe .carousel-card .img-wrap{height:100%}
/* ========== 响应式 ========== */
@media(max-width:768px){
  #app{height:auto;min-height:100vh}
  .main-content{flex-direction:column}
  .left-panel{width:100%;border-right:none;border-bottom:1px solid var(--border);padding:10px;min-height:0}
  .carousel-wrap{perspective:none;flex:none;min-height:0}
  :root{--carousel-radius:180px}
  .carousel-wrap::before{display:none}
  .info-panel{padding:8px 0}
  .color-name-row .name{font-size:22px}
  .right-panel{height:auto;max-height:52vh}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .color-card{padding:12px 4px 8px}
  .color-swatch{width:64px;height:64px}
  .palette-item{width:30px;height:30px}
  .palette-item-name{font-size:9px;max-width:34px}
  header h1{font-size:18px}
  .today-badge{position:static;margin:6px auto 0;display:inline-flex}
  header{padding-bottom:10px}
  .twin-overlay{padding:0;align-items:flex-end}
  .twin-panel{max-width:100%;max-height:92vh;border-radius:16px 16px 0 0}
  .twin-header{padding:28px 20px 16px}
  .twin-header h2{font-size:1.1rem}
  .twin-body{padding:0 20px 24px}
  .twin-card{min-width:160px;padding:10px 14px}
}
@media(max-width:480px){
  .carousel-swipe .carousel-card{flex-basis:88%;width:88%;aspect-ratio:4/4.6}
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .color-card{padding:10px 4px 6px}
  .color-swatch{width:52px;height:52px}
  .palette-item{width:26px;height:26px}
  .palette-item-name{font-size:8px;max-width:30px}
  .viz-panel{gap:14px;padding:10px}
}
/* ========== 减少动态偏好 ========== */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .flip-inner{transition:none}
}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>中国传统色彩</h1>
    <div class="sub">共 <span id="totalCount">67</span> 色 · 点击颜色卡为画作着色</div>
    <button class="today-badge" id="todayBtn" title="今日一色，点击直达">
      <span class="sw" id="todaySwatch"></span><span id="todayName">今日一色</span>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="切换明暗主题" title="切换明暗主题">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg>
    </button>
  </header>

  <div class="main-content">
    <div class="left-panel">
      <div class="carousel-wrap" id="carouselWrap">
        <div class="carousel" id="carousel" aria-label="画作轮播"></div>
      </div>
      <div class="flip-wrap" id="infoPanel" role="button" tabindex="0" aria-expanded="false" aria-label="颜色信息卡，回车或空格翻转查看诗句与实物">
        <div class="flip-inner">
          <div class="flip-front">
            <div class="info-panel">
              <div class="color-name-row">
                <span class="name" id="currentName">朱红</span>
                <span class="hex" id="currentHex">#FF4C00</span>
              </div>
              <div class="color-desc" id="currentDesc"></div>
              <div class="info-actions">
                <button class="mini-btn" id="favBtn" aria-pressed="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.7-4.35-9.3-8.1C.8 9.9 2.4 5.5 6.3 5.5c2.2 0 3.5 1.2 4.2 2.4.7-1.2 2-2.4 4.2-2.4 3.9 0 5.5 4.4 3.6 7.4C18.7 16.65 12 21 12 21z"/></svg>
                  <span id="favLabel">收藏</span>
                </button>
                <button class="mini-btn" id="exportBtn" aria-haspopup="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                  导出
                </button>
                <button class="mini-btn" id="shareBtn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
                  分享
                </button>
              </div>
              <div class="related-label">— 同系颜色 —</div>
              <div class="related-chips" id="relatedChips"></div>
              <div class="palette-section">
                <div class="palette-label">— 配色灵感 · 规则搭配 —</div>
                <div class="palette-row" id="paletteRow"></div>
              </div>
            </div>
          </div>
          <div class="flip-back">
            <div class="back-poem" id="backPoem"></div>
            <div class="back-object-label">— 对应实物 —</div>
            <div class="back-object" id="backObject"></div>
            <div class="related-label" style="margin-top:10px">— 相近色 · 跨色系 CIELAB —</div>
            <div class="related-chips" id="nearChips"></div>
            <div class="flip-hint">点击翻回</div>
          </div>
        </div>
      </div>
    </div>

    <div class="right-panel">
      <div class="toolbar">
        <div class="filter-group" id="filterGroup">
          <button class="btn filter-btn active" data-family="all" aria-pressed="true">全部</button>
        </div>
        <button class="btn mode-btn" id="modeBtn" aria-pressed="false">
          <svg id="modeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5-9 9"/></svg>
          <span id="modeLabel">画作</span>
        </button>
        <button class="btn mode-btn" id="statsBtn" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          统计
        </button>
        <input class="search-input" id="searchInput" placeholder="搜索颜色名..." autocomplete="off" aria-label="搜索颜色名">
      </div>
      <div class="viz-panel" id="vizPanel" hidden>
        <div>
          <div class="viz-title">色系分布</div>
          <div class="donut" id="donut"><div class="donut-center"><b id="donutTotal">67</b>色</div></div>
          <div class="donut-legend" id="donutLegend"></div>
        </div>
        <div style="position:relative">
          <div class="viz-title">色相-饱和度分布 · 悬停查看色名</div>
          <canvas id="hueCanvas" width="260" height="260" role="img" aria-label="色相饱和度分布散点图"></canvas>
        </div>
      </div>
      <div class="grid-wrap">
        <div class="grid" id="colorGrid"></div>
        <div class="empty-state" id="emptyState" hidden>没有找到匹配的颜色</div>
      </div>
    </div>
  </div>

  <div class="hint-bar">
    拖拽 360° 环绕 · 点击颜色卡着色 · 键盘 ← → 切换画作 · Enter 翻转信息卡
    <span class="hint-bar-sep">·</span>
    <button class="hint-twin-btn" id="twinOpenBtn">孪生宇宙 <span class="hint-sub">点击见大世界</span></button>
  </div>
</div>

<!-- 孪生宇宙弹窗 -->
<div class="twin-overlay" id="twinView" role="dialog" aria-modal="true" aria-labelledby="twinTitle">
  <div class="twin-panel">
    <button class="twin-close" id="twinClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="twin-header">
      <h2 id="twinTitle">中国传统色孪生宇宙</h2>
      <p class="twin-subtitle">我的其他项目 · 点击跳转</p>
    </div>
    <div class="twin-body" id="twinContainer">
      <div class="twin-msg" id="twinLoading">正在连接孪生宇宙…</div>
      <div class="twin-msg" id="twinError" hidden>暂时无法连接孪生宇宙，请稍后再试</div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js?v=20260812"></script>
<script src="app.js?v=20260812"></script>
</body>
</html>
